name: EIP Odoo OpenMRS Integration Tests

on:
  repository_dispatch:
    types: [ eip-odoo-openmrs-it ]

# Cancel a previous, still-running dispatch so the latest one wins (saves the long Ozone-stack run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.sha || github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-spotless-check.yml@main

  validate:
    needs: spotless
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-build-test.yml@main
    with:
      maven-args: '-pl eip-odoo-openmrs-it -am'
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
